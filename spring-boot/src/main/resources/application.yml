# =====================================================================
# Konfiguracja aplikacji szkoleniowej. Kazdy blok opisuje, ktorej lekcji dotyczy.
# Kolejnosc waznosci (wyzsze wygrywa): argumenty --klucz=wartosc > zmienne
# srodowiskowe (SZKOLENIE_KURS_NAZWA) > application-<profil>.yml > ten plik.
# =====================================================================

spring:
  application:
    name: spring-boot-szkolenie

  # --- Lekcja 9: kazde zadanie HTTP w watku wirtualnym (Java 21+) ---
  threads:
    virtual:
      enabled: true

  mvc:
    # --- Lekcja 4: bledy (takze walidacji) jako application/problem+json ---
    problemdetails:
      enabled: true
    # --- Lekcja 9: wersjonowanie API z naglowka ---
    apiversion:
      use:
        header: API-Version
      default: 1.0
      # Wersje, ktore przyjmujemy. Mapowanie "2.0+" obsluzy tez 3.0, bo nikt nie zmapowal 3.0.
      # Wersja spoza listy (np. 9.9) = 400 Bad Request.
      supported: 1.0, 2.0, 3.0

  # --- Lekcja 5: JPA / H2 ---
  # Brak spring.datasource.url = Boot tworzy baze H2 w pamieci o losowej nazwie.
  # Adres znajdziesz w logu przy starcie ("H2 console available at ...").
  jpa:
    open-in-view: false          # zadnych zapytan SQL z warstwy widoku - patrz docs/05-dane.md
    defer-datasource-initialization: true   # data.sql PO utworzeniu tabel przez Hibernate
    show-sql: false              # Eksperyment: ustaw na true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true              # http://localhost:8080/h2-console

  # --- Lekcja 8: deklaratywne klienty HTTP, grupa "miejsca" ---
  http:
    serviceclient:
      miejsca:
        base-url: http://localhost:${server.port:8080}
        read-timeout: 5s

server:
  port: 8080

# --- Lekcja 7: Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,beans,conditions,mappings,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  aplikacja:
    opis: Szkolenie ze Spring Boot 4
    wersja-javy: ${java.version}

# --- Lekcje 1, 3, 8: nasze wlasne wlasciwosci ---
szkolenie:
  start:
    raport: true                 # Lekcja 1: false = RaportStartowy w ogole nie powstanie
  kurs:                          # Lekcja 3: KursProperties
    nazwa: Spring Boot od podstaw
    maks-uczestnikow: 12
    czas-lekcji: 90m
    prowadzacy:
      - Ala
      - Olek
    sala:
      budynek: B2
      pietro: 3
  przewodnik:
    base-url: http://localhost:${server.port:8080}

logging:
  level:
    com.tomtom.genesis.training: INFO
    # Eksperyment (lekcja 5): odkomentuj, zeby zobaczyc SQL i parametry
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
